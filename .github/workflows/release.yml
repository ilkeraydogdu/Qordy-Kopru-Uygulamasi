name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build macOS DMG
        run: |
          chmod +x scripts/build_macos_dmg.sh
          ./scripts/build_macos_dmg.sh

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qordy_Bridge_macOS_DMG
          path: dist/*.dmg

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Windows Release Binary
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          if (!(Test-Path "target\release")) { New-Item -ItemType Directory -Force -Path "target\release" }
          Copy-Item "target\x86_64-pc-windows-msvc\release\qordy_bridge_rs.exe" "target\release\qordy_bridge_rs.exe" -Force

      - name: Setup Inno Setup
        uses: dactiv/setup-inno-setup@v1

      - name: Compile Inno Setup Installer
        run: |
          if (!(Test-Path "dist")) { New-Item -ItemType Directory -Force -Path "dist" }
          iscc scripts/windows_installer.iss

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qordy_Bridge_Windows_Installer
          path: dist/*.exe

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Qordy_Bridge_macOS_DMG
          path: dist/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Qordy_Bridge_Windows_Installer
          path: dist/

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
